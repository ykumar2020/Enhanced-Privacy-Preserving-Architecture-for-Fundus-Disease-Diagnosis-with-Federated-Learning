project:
  run_id: odir_paper_hyperparameters_patient_safe
  seed: 2025
data:
  annotations: data/odir/ODIR-5K/labels_perEye.csv
  image_dir: data/odir/ODIR-5K/raw
  output_dir: runs/odir_paper_hyperparameters_patient_safe
  task: multilabel
  label_source: original_per_eye_csv
  decision_threshold: 0.55
  classes: [normal, cataract, glaucoma]
  strict_eye_labels: true
  exclude_multilabel: false
  patient_separated: true
  split: [0.64, 0.16, 0.20]
  num_clients: 4
preprocess:
  clahe_mode: original_lab_l
  clahe_clip_limit: 10.0
  clahe_grid_size: 8
  crop_background_threshold: 10
  image_size: 224
  horizontal_flip_probability: 0.5
  vertical_flip_probability: 0.5
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.228, 0.224, 0.225]
model:
  architecture: vgg19
  imagenet_weights: true
  freeze_features: true
training:
  batch_size: 16
  learning_rate: 0.001
  optimizer: adam
  centralized_epochs: 5
  local_epochs: 1
  rounds: 5
  clients_per_round: 2
  num_workers: 0
  device: auto
federated:
  aggregation: sample_weighted_fedavg
  selection: seeded_without_replacement

