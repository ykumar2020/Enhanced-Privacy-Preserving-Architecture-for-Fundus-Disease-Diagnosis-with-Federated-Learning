[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retina-fl-reproduction"
version = "0.1.0"
description = "Auditable reproduction and extension framework for federated fundus-image classification"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "opencv-python-headless>=4.9",
  "Pillow>=10.2",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
colab = ["kagglehub>=1.0.2"]

[project.scripts]
retina-fl = "retina_fl.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

